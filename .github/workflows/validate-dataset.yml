name: Validate PixAI dataset

on:
  push:
    paths:
      - "dataset/train.jsonl"
      - "scripts/prepare_dataset.py"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "dataset/train.jsonl"
      - "scripts/prepare_dataset.py"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and split dataset
        run: python scripts/prepare_dataset.py --input dataset/train.jsonl --output-dir prepared

      - name: Upload prepared splits
        uses: actions/upload-artifact@v4
        with:
          name: pixai-prepared-dataset
          path: prepared/
          if-no-files-found: error
